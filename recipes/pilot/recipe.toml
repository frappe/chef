name        = "pilot"
version     = "0.1.0"
description = "A Frappe/Pilot golden: a working Pilot admin console + a Frappe site."
base_image  = "ubuntu-24.04"
modes       = ["cold", "warm", "both"]   # `both` = one VM, cold image + warm signup snapshot
tags        = ["frappe", "pilot"]

[phases]
build    = "recipe:build"
verify   = "recipe:verify"
warm_arm = "recipe:warm_arm"             # prime the site before the warm capture (both/warm bakes)

[size]
vcpus = 2
memory_megabytes = 4096                 # what a clone serves at
disk_gigabytes = 25
build_memory_megabytes = 6144           # boot fat: `pilot init` builds frappe assets (yarn)

[inputs.admin_password]
type = "string"
default = "admin123"
description = "Password for the Pilot admin console (bench.toml [admin].password)."

[inputs.site_name]
type = "string"
default = "site.local"
description = "The Frappe site to create and serve."

[inputs.admin_domain]
type = "string"
default = "admin.local"
description = "Host the admin console is reached at (nginx server_name)."

[inputs.frappe_branch]
type = "string"
default = "version-16"
description = "Frappe app branch (bench.toml frappe [[apps]].branch)."

[[track]]
repo = "frappe/pilot"                   # the pilot release baked in; pin it via the
                                        # Releases page / `chef releases set frappe/pilot <tag>`.

[[publish]]
type = "atlas-base-image"               # the SERVER golden: promote a cold base image `create_vm` boots
name = "pilot-chef"
distribute = true                       # after promoting on the build host, fan out to the rest of the fleet host-to-host (no S3)
register_user_image = true              # wire it as Atlas default_user_image so servers boot it out of the box

[[publish]]
type = "atlas-bench-snapshot"           # the SIGNUP golden: register the cold snapshot a self-serve Site clones
                                        # (default_bench_snapshot). A `both` bake's warm snapshot is auto-discovered.

[[publish]]
type = "local"
