name        = "bench"
version     = "16.0.0"
description = "Golden Frappe/ERPNext bench image (v16) — upload the committed bench/ tree and run its build.sh verbatim (shim)."
base_image  = "ubuntu-24.04"
modes       = ["cold", "warm"]
tags        = ["bench", "frappe", "erpnext", "atlas", "shim"]

[phases]
build    = "recipe:build"
verify   = "recipe:verify"
warm_arm = "recipe:warm_arm"

[size]
vcpus = 2
memory_megabytes = 2048
disk_gigabytes = 28
# Boot the build VM fat (bench init / get-app build Node assets at ~4 GB peak),
# then resize DOWN to memory_megabytes before the snapshot (image_recipes.py
# _BENCH_BUILD_MEMORY_MB). 0 would mean "same as memory_megabytes".
build_memory_megabytes = 6144

[inputs.frappe_branch]
type        = "string"
default     = "version-16"
description = "Frappe git branch. For the shim this must match the committed bench.toml (version-16); rendering it into bench.toml is a later milestone."

[inputs.erpnext_branch]
type        = "string"
default     = "version-16"
description = "ERPNext git branch, injected into build.sh as the ERPNEXT_BRANCH env override."

[inputs.python_version]
type        = "string"
default     = "3.14"
description = "Python interpreter uv installs the venv with. Pinned in the committed bench.toml (version-16 → 3.14)."

[inputs.bench_cli_ref]
type        = "string"
default     = ""
description = "pilot (bench-cli) git ref, injected as BENCH_CLI_REF. Empty = unpinned, taking whatever pilot's documented release install delivers (matches image_recipes.py _BENCH_CLI_REF)."

[inputs.build_mode]
type        = "string"
default     = "site"
enum        = ["site", "admin"]
description = "site bakes a serving Frappe/ERPNext site; admin bakes only the bench + admin console. Passed to build.sh as its positional arg."

[[publish]]
type = "atlas-base-image"
name = "bench-v16-chef"
