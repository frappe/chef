name        = "proxy"
version     = "1.0.0"
description = "Atlas reverse-proxy image — native pyinfra build of the nginx + OpenResty Lua stack (no build.sh)."
base_image  = "ubuntu-24.04"
modes       = ["cold"]
tags        = ["proxy", "atlas", "native"]

[phases]
build  = "recipe:build"
verify = "recipe:verify"

[size]
vcpus = 2
memory_megabytes = 1024
disk_gigabytes = 20

[[publish]]
type = "atlas-s3"                       # durable off-host copy (nothing left on the host)

[[publish]]
type = "local"
