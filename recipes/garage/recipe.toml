name        = "garage"
version     = "1.0.0"
description = "S3 storage for atlas."
base_image  = "ubuntu-24.04"
modes       = ["cold"]
tags        = ["garage", "atlas", "native"]

[phases]
build  = "recipe:build"
verify = "recipe:verify"

[size]
vcpus = 2
memory_megabytes = 1024
disk_gigabytes = 20

[[publish]]
type = "atlas-s3"                       # durable off-host copy (nothing left on the host)

[[publish]]
type = "local"
